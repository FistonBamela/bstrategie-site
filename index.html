<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>bStratégie web académie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style id="css">
:root{
  --bg:#f5f9fe; --surface:#ffffff; --fg:#0e1b2e; --muted:#566478; --line:#d9e4f1;
  --blue:#1473b9; --blue-deep:#0a3f73; --red:#e30f2d; --band:#0b2342; --band-fg:#f2f7fd;
  --band-muted:#a9bbd2; --chip:#eaf3fc; --shadow:0 18px 40px -22px rgba(10,63,115,.35);
  --font-display:'Outfit','Segoe UI',system-ui,sans-serif;
  --font-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08111f; --surface:#0f1c30; --fg:#eaf1fb; --muted:#9fb0c6; --line:#1f3150;
    --blue:#4aa3ff; --blue-deep:#7fbcff; --red:#ff5068; --band:#0a1a31; --band-fg:#f2f7fd;
    --band-muted:#a9bbd2; --chip:#14253f; --shadow:0 18px 40px -22px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08111f; --surface:#0f1c30; --fg:#eaf1fb; --muted:#9fb0c6; --line:#1f3150;
  --blue:#4aa3ff; --blue-deep:#7fbcff; --red:#ff5068; --band:#0a1a31; --band-fg:#f2f7fd;
  --band-muted:#a9bbd2; --chip:#14253f; --shadow:0 18px 40px -22px rgba(0,0,0,.8); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;font-size:14px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
img{max-width:100%;display:block}
button{font-family:inherit}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.grad{background:linear-gradient(90deg,var(--blue),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;cursor:pointer;font:600 .86rem var(--font-body);padding:.7rem 1.1rem;border-radius:999px;text-decoration:none;transition:transform .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn[disabled]{opacity:.6;cursor:default;transform:none}
.btn-primary{background:linear-gradient(90deg,var(--blue) 0%,#2b5fb0 55%,var(--red) 130%);color:#fff;box-shadow:0 12px 24px -14px var(--blue)}
.btn-ghost{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn-sm{padding:.5rem .85rem;font-size:.8rem}
.btn-red{background:var(--red);color:#fff}

.js .rv{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease;transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}

/* barre annonce */
.topbar{background:var(--band);color:var(--band-fg);font-size:.8rem}
.topbar .wrap{display:flex;gap:.6rem;align-items:center;justify-content:center;min-height:34px;padding-block:.3rem;text-align:center;flex-wrap:wrap}
.topbar .tag{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.14);padding:.12rem .45rem;border-radius:99px}
.topbar a{font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--red)}
.topbar .msg{transition:opacity .4s}

/* navigation */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:.8rem;min-height:56px}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font:700 .92rem var(--font-display);min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 0 1px var(--line);flex:none}
.navr{display:flex;align-items:center;gap:.5rem;flex:none}
.burger{width:40px;height:40px;border-radius:12px;border:0;cursor:pointer;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-content:center;gap:4px;padding:0}
.burger span{display:block;width:18px;height:2px;border-radius:2px;background:var(--fg);transition:transform .25s,opacity .25s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
@media(max-width:520px){.brand span{font-size:.84rem}.navr .hide-sm{display:none}}

/* tiroirs */
.scrim{position:fixed;inset:0;background:rgba(5,12,24,.5);z-index:84;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);background:var(--surface);z-index:90;transform:translateX(100%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none;visibility:visible;transition:transform .3s ease}
.drawer.admin{width:min(460px,100vw);z-index:92}
.dh{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;border-bottom:1px solid var(--line);font:700 .95rem var(--font-display)}
.x{width:34px;height:34px;border-radius:10px;border:0;background:var(--chip);color:var(--fg);cursor:pointer;font-size:1rem}
.menu-list{padding:.6rem;display:grid;gap:2px;overflow:auto}
.menu-list a,.menu-list button{display:flex;align-items:center;gap:.6rem;text-align:left;border:0;background:transparent;color:var(--fg);padding:.7rem .8rem;border-radius:12px;font:600 .92rem var(--font-body);cursor:pointer;text-decoration:none;width:100%}
.menu-list a:hover,.menu-list button:hover{background:var(--chip);color:var(--blue)}
.menu-list .sep{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:.9rem .8rem .3rem}
.menu-list .dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
.menu-list .dot.b{background:var(--blue)}

/* accueil */
.hero{position:relative;padding-block:clamp(2rem,5vw,3.6rem) clamp(2rem,4vw,3rem);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:2rem;align-items:center;position:relative}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}}
.hero h1{font-size:clamp(1.55rem,3.3vw,2.3rem);font-weight:800;margin-top:.7rem}
.rotwrap{display:block;height:1.15em;overflow:hidden;position:relative}
.rot{display:block;transition:transform .55s cubic-bezier(.7,0,.2,1),opacity .55s}
.hero p.lead{font-size:.95rem;color:var(--muted);max-width:30rem;margin-top:.9rem}
.cta-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.3rem}
.who{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1.2rem}
.who span{background:var(--chip);color:var(--blue-deep);font-weight:600;font-size:.75rem;padding:.28rem .7rem;border-radius:99px}
.stage{position:relative;aspect-ratio:1/1;max-width:400px;width:100%;margin-inline:auto}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55}
.blob.b1{width:60%;height:60%;left:-6%;top:6%;background:var(--blue);animation:drift 9s ease-in-out infinite}
.blob.b2{width:55%;height:55%;right:-4%;bottom:2%;background:var(--red);opacity:.4;animation:drift 11s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(18px,-16px) scale(1.08)}}
.ring{position:absolute;inset:9%;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--blue) 55%,transparent);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-card{position:absolute;inset:23%;border-radius:12%;background:#fff;box-shadow:var(--shadow),0 0 0 1px var(--line);overflow:hidden;animation:bob 6s ease-in-out infinite}
.logo-card img{width:100%;height:100%;object-fit:cover}
@keyframes bob{50%{transform:translateY(-10px)}}
.chip{position:absolute;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--line);border-radius:99px;padding:.4rem .75rem;font:600 .74rem var(--font-body);display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.chip.c2 i,.chip.c4 i{background:var(--red)}
.chip.c1{left:-2%;top:12%;animation:bob 5s ease-in-out infinite}
.chip.c2{right:-3%;top:26%;animation:bob 6.5s ease-in-out -2s infinite}
.chip.c3{left:2%;bottom:14%;animation:bob 7s ease-in-out -1s infinite}
.chip.c4{right:2%;bottom:6%;animation:bob 5.6s ease-in-out -3s infinite}

.ticker{background:var(--surface);border-block:1px solid var(--line);overflow:hidden;padding-block:.75rem}
.ticker .track{display:flex;gap:2rem;width:max-content;animation:scroll 32s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker span{font:600 .85rem var(--font-display);color:var(--muted);display:flex;align-items:center;gap:2rem;white-space:nowrap}
.ticker span::after{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(90deg,var(--blue),var(--red))}
@keyframes scroll{to{transform:translateX(-50%)}}

section{padding-block:clamp(2rem,5vw,3.8rem);scroll-margin-top:72px}
.head{max-width:36rem;margin-bottom:1.6rem}
.head h2{font-size:clamp(1.25rem,2.3vw,1.65rem);font-weight:800;margin-top:.4rem}
.head p{color:var(--muted);margin-top:.6rem;font-size:.9rem}

.services{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
@media(max-width:900px){.services{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.services{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.2rem;transition:transform .25s,box-shadow .25s,border-color .25s;min-width:0}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:var(--blue);margin-bottom:.9rem;transition:background .25s,color .25s}
.card:hover .ico{background:var(--blue);color:#fff}
.ico svg{width:22px;height:22px}
.card h3{font-size:.98rem;font-weight:700}
.card p{color:var(--muted);margin-top:.4rem;font-size:.84rem}
.card ul{list-style:none;padding:0;margin:.8rem 0 0;display:grid;gap:.35rem;font-size:.8rem}
.card li{display:flex;gap:.5rem;align-items:flex-start}
.card li::before{content:"";flex:none;width:7px;height:7px;margin-top:.5em;border-radius:50%;background:var(--red)}
.card.feat{grid-column:span 2;background:linear-gradient(135deg,var(--blue-deep),var(--blue) 70%,#3a5fb0);color:#fff;border:0;position:relative;overflow:hidden}
.card.feat::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(227,15,45,.55),transparent 70%)}
.card.feat p,.card.feat li{color:rgba(255,255,255,.9)}
.card.feat .ico{background:rgba(255,255,255,.18);color:#fff}
.card.feat .flag{display:inline-block;background:#fff;color:var(--red);font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.18rem .55rem;border-radius:99px;margin-bottom:.8rem}
.card.feat ul{grid-template-columns:1fr 1fr}
@media(max-width:600px){.card.feat{grid-column:auto}.card.feat ul{grid-template-columns:1fr}}

.band{background:var(--band);color:var(--band-fg);position:relative;overflow:hidden}
.band::before{content:"";position:absolute;left:-120px;bottom:-160px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(20,115,185,.55),transparent 70%)}
.band::after{content:"";position:absolute;right:-120px;top:-160px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(227,15,45,.4),transparent 70%)}
.band .wrap{position:relative;z-index:1}
.band .eyebrow{color:#7fbcff}
.band .head p{color:var(--band-muted)}
.aud{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
@media(max-width:860px){.aud{grid-template-columns:1fr}}
.aud .a{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);border-radius:18px;padding:1.2rem;transition:transform .25s,background .25s;min-width:0}
.aud .a:hover{transform:translateY(-4px);background:rgba(255,255,255,.1)}
.aud .num{font:800 clamp(1.7rem,3.4vw,2.3rem) var(--font-display);line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#7fbcff,#ff6a7d);-webkit-background-clip:text;background-clip:text;color:transparent}
.aud .lbl{font-weight:700;margin-top:.35rem;font-size:.9rem}
.aud p{color:var(--band-muted);font-size:.82rem;margin-top:.5rem}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin-top:1.2rem;border-top:1px solid rgba(255,255,255,.14);padding-top:1.2rem}
@media(max-width:700px){.mini{grid-template-columns:1fr 1fr}}
.mini b{display:block;font:700 1.25rem var(--font-display);font-variant-numeric:tabular-nums}
.mini span{color:var(--band-muted);font-size:.78rem}

.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem;align-items:center}
.tab{border:0;cursor:pointer;font:600 .8rem var(--font-body);padding:.45rem .95rem;border-radius:99px;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);transition:all .2s}
.tab[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:none}
.seg{margin-left:auto;display:flex;gap:2px;background:var(--surface);padding:3px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{border:0;background:transparent;color:var(--muted);font:700 .75rem var(--font-body);padding:.35rem .75rem;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.rate{font-size:.7rem;color:var(--muted);margin:-.6rem 0 1rem;text-align:right}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
@media(max-width:960px){.shop{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.shop{grid-template-columns:1fr}}
.prod{padding:0;overflow:hidden;display:flex;flex-direction:column}
.prod[hidden],.real[hidden]{display:none}
.cover{height:104px;position:relative;display:flex;align-items:flex-end;padding:.8rem;color:#fff;background:linear-gradient(135deg,var(--c1,#0a3f73),var(--c2,#1473b9));overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.cover .kind{position:relative;z-index:1;font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:.18rem .55rem;border-radius:99px}
.cover .tagn{position:absolute;right:.7rem;top:.7rem;z-index:1;background:#fff;color:var(--red);font-size:.62rem;font-weight:800;padding:.16rem .5rem;border-radius:99px;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.prod .body{padding:1.05rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.prod h3{font-size:.95rem}
.prod .meta{display:flex;gap:.8rem;flex-wrap:wrap;color:var(--muted);font-size:.76rem}
.prod .buy{margin-top:auto;padding-top:.7rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.price{font:800 1.05rem var(--font-display);font-variant-numeric:tabular-nums}
.price small{display:block;font:500 .68rem var(--font-body);color:var(--muted)}
.prod.ad{border-style:dashed;border-color:color-mix(in srgb,var(--red) 50%,var(--line));background:color-mix(in srgb,var(--red) 4%,var(--surface))}
.prod.ad .cover{background:repeating-linear-gradient(135deg,var(--chip) 0 14px,transparent 14px 28px);color:var(--muted)}
.prod.ad .cover .kind{background:var(--surface);color:var(--red)}
.paystrip{display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:1.2rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem;font-size:.82rem;color:var(--muted)}
.paystrip b{color:var(--fg)}

.real{padding:0;overflow:hidden;display:flex;flex-direction:column}
.shot{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,var(--c1,#0a3f73),var(--c2,#1473b9));display:grid;place-items:center;color:rgba(255,255,255,.9);border:0;padding:0;width:100%;font:inherit}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.real:hover .shot img{transform:scale(1.06)}
button.shot{cursor:zoom-in}
.shot .phd{text-align:center;display:grid;gap:.3rem;justify-items:center;font-size:.74rem;font-weight:600;padding:1rem}
.shot .phd svg{width:30px;height:30px;opacity:.85}
.shot .cat{position:absolute;left:.7rem;top:.7rem;z-index:1;background:rgba(255,255,255,.92);color:var(--blue-deep);font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.16rem .55rem;border-radius:99px}
.real .body{padding:1rem 1.1rem 1.2rem}
.real h3{font-size:.95rem}

.adwide{padding-block:0 clamp(2rem,5vw,3.4rem)}
.adbox{position:relative;border-radius:22px;overflow:hidden;border:1px dashed color-mix(in srgb,var(--blue) 40%,var(--line));background:var(--surface)}
.slide{display:none;align-items:center;gap:1.2rem;padding:1.2rem 1.5rem;min-height:120px;animation:fade .6s}
.slide.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.slide .ph{flex:none;width:140px;height:84px;border-radius:14px;background:linear-gradient(135deg,var(--accent,var(--blue)),var(--accent2,var(--red)));display:grid;place-items:center;color:#fff;font:800 .9rem var(--font-display);overflow:hidden;text-align:center;padding:.5rem}
.slide .ph img{width:100%;height:100%;object-fit:cover}
.slide .tx{flex:1;min-width:0}
.slide h3{font-size:1rem}
.slide p{color:var(--muted);margin-top:.25rem;font-size:.84rem}
.sp{position:absolute;right:14px;top:8px;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
@media(max-width:700px){.slide{flex-direction:column;align-items:flex-start}.slide .ph{width:100%}}

.tm{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--blue) 7%,transparent))}
.tmbox{position:relative;max-width:720px;margin-inline:auto}
.quote{display:none;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(1.2rem,3vw,2rem);box-shadow:var(--shadow);animation:fade .6s;margin:0}
.quote.on{display:block}
.quote .qm{font:800 3rem/0.6 var(--font-display);color:var(--red)}
.quote blockquote{margin:.3rem 0 1rem;font:500 clamp(.95rem,1.6vw,1.1rem)/1.5 var(--font-display)}
.who2{display:flex;align-items:center;gap:.7rem}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 .92rem var(--font-display);background:linear-gradient(135deg,var(--blue),var(--red));overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.who2 b{display:block;font-size:.88rem}
.who2 span{color:var(--muted);font-size:.8rem}
.stars{margin-left:auto;color:#f0a400;letter-spacing:2px;font-size:.85rem}
.tmnav{display:flex;align-items:center;justify-content:center;gap:.9rem;margin-top:1.2rem}
.arrow{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line);font-size:1rem;transition:all .2s}
.arrow:hover{background:var(--blue);color:#fff;box-shadow:none}
.dots{display:flex;gap:.4rem}
.dots button{width:8px;height:8px;border-radius:99px;border:0;padding:0;cursor:pointer;background:var(--line);transition:all .25s}
.dots button[aria-current="true"]{width:24px;background:linear-gradient(90deg,var(--blue),var(--red))}

let io = null;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el) {
  $$("[data-n]", el).concat(el.matches && el.matches("[data-n]") ? [el] : []).forEach(n => {
    const end = +n.dataset.n, t0 = performance.now();
    const tick = t => { const p = Math.min(1, (t - t0) / 1400); n.textContent = "+" + Math.round(end * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
function observe(instant) {
  if (!("IntersectionObserver" in window) || calm) { $$(".rv").forEach(e => e.classList.remove("rv")); return; }
  document.documentElement.classList.add("js");
  if (!io) io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const tg = e.target; tg.classList.add("in"); io.unobserve(tg); countUp(tg);
    setTimeout(() => tg.classList.remove("rv", "in"), 1100);
  }), { threshold: .12 });
  $$(".rv:not([data-o])").forEach(el => {
    el.dataset.o = 1;
    if (instant) el.classList.remove("rv"); else io.observe(el);
  });
}

async function shrink(file, max = 1400) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", .85));
}
async function uploadImage(file) {
  const blob = await shrink(file);
  if (role.mode === "supabase") return sb.upload(blob, Date.now() + "-" + Math.random().toString(36).slice(2, 7) + ".jpg");
  const assets = window.claude?.use ? await window.claude.use("assets") : null;
  if (!assets) throw new Error("Le téléversement d'images n'est pas disponible ici.");
  const r = await assets.upload(blob); return r.url;
}

}

let gsel = "supabase";
function renderGuide() {
  $("#gtabs").innerHTML = GUIDE.map(g => `<button type="button" data-g="${g.id}" aria-pressed="${g.id === gsel}">${esc(g.nom)}</button>`).join("");
  const g = GUIDE.find(x => x.id === gsel);
  $("#gbox").innerHTML = `<h3>${esc(g.titre)}</h3><ol>${g.etapes.map(e => `<li>${e}</li>`).join("")}</ol>
    ${g.code ? `<div class="row" style="margin:.4rem 0"><button class="mini-btn add" type="button" data-copycode="${g.id}">Copier le code</button></div><pre class="code">${esc(g.code)}</pre>` : ""}
    ${g.note ? `<p class="note" style="margin-top:.7rem">${esc(g.note)}</p>` : ""}
    <p style="margin-top:.8rem;font-size:.78rem">Ordre conseillé : 1. Supabase, 2. Vercel, 3. E-mail, 4. Oh My Claude Code pour modifier, 5. Chrome DevTools pour contrôler.</p>`;
}

/* ---------------------------------- événements ---------------------------------- */
document.addEventListener("click", async e => {
  const t = e.target;
  const q = s => t.closest(s);
  let el;
  if ((el = q("#burger"))) { $("#menu").classList.contains("open") ? hide("menu") : show("menu"); return; }
  if (q("#scrim")) { hide("menu"); return; }
  if ((el = q("[data-close]"))) { hide(el.dataset.close); if (el.dataset.close === "admin") setDirty(dirty); return; }
  if ((el = q("[data-nav]"))) { hide("menu"); return; }
  if ((el = q("[data-open]"))) {
    const k = el.dataset.open; hide("menu");
    if (k === "free") openFree(); else if (k === "pay") openPay(null); else if (k === "guide") { renderGuide(); show("guide"); } else show(k);
    return;
  }
  if ((el = q("[data-sec]"))) { if (!edit.on || !$("#admin").classList.contains("open")) openEditor(el.dataset.sec); else { edit.sec = el.dataset.sec; renderPanel(); } return; }
  if ((el = q("[data-gf]"))) { startChat(+el.dataset.gf); return; }
  if ((el = q("[data-ch]"))) { const c = chat.ch[+el.dataset.ch]; $("#qr").hidden = true; if (c && c[1]) c[1](); return; }
  if ((el = q("[data-buy]"))) { openPay(+el.dataset.buy); return; }
  if ((el = q("[data-copy]"))) { copyNum(+el.dataset.copy, el); return; }
  if ((el = q("[data-copycode]"))) { const g = GUIDE.find(x => x.id === el.dataset.copycode); try { await navigator.clipboard.writeText(g.code); el.textContent = "Copié"; } catch (er) { const r = document.createRange(); r.selectNodeContents($("pre.code")); getSelection().removeAllRanges(); getSelection().addRange(r); el.textContent = "Sélectionné : copie avec Ctrl+C"; } return; }
  if ((el = q("[data-g]"))) { gsel = el.dataset.g; renderGuide(); return; }
  if ((el = q("[data-cur]"))) { ui.cur = el.dataset.cur; store.set("bs_cur", ui.cur); renderShop(); observe(true); return; }
  if ((el = q("[data-ft]"))) { ui.fcat = el.dataset.ft; renderShop(); observe(true); return; }
  if ((el = q("[data-rt]"))) { ui.rcat = el.dataset.rt; renderReal(); observe(true); return; }
  if ((el = q("[data-tm]"))) { goTm(+el.dataset.tm); return; }
  if ((el = q("[data-img]"))) { $("#lbimg").src = el.dataset.img; show("lb"); return; }
  if (q("#lb")) { hide("lb"); return; }
  if (q("#prev")) { goTm(ui.tm - 1); return; }
  if (q("#next")) { goTm(ui.tm + 1); return; }
  if (q("#adpub") || q("#sbpub")) { publish(); return; }
  if ((el = q("[data-act]"))) { await adminAct(el); return; }
  if (t.classList && t.classList.contains("modal") && t.id !== "lb") { t.hidden = true; }
});
async function adminAct(el) {
  const a = el.dataset.act, p = el.dataset.p, i = +el.dataset.i;
  if (a === "start-edit") { openEditor(); return; }
  if (a === "exit-edit") { edit.on = false; hide("admin"); renderMenu(); hide("menu"); setDirty(dirty); return; }
  if (a === "logout") { sb.token = null; try { sessionStorage.removeItem("bs_tok"); } catch (e) {} role.admin = false; role.mode = null; edit.on = false; hide("menu"); renderMenu(); return; }
  if (a === "upload") {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
    inp.onchange = async () => {
      if (!inp.files[0]) return; el.textContent = "Envoi…";
      try { const url = await uploadImage(inp.files[0]); setp(S, p, url); touch(p); renderPanel(); }
      catch (e) { el.textContent = "Choisir une image"; $("#adstatus").textContent = "Image : " + (e.message || "échec"); }
    };
    inp.click(); return;
  }
  if (a === "clearimg") { setp(S, p, ""); touch(p); renderPanel(); return; }
  const b = findBlock(p), arr = b && get(S, p); if (!arr) return;
  if (a === "add") arr.push(clone(b.nw || {}));
  else if (a === "del") arr.splice(i, 1);
  else if (a === "up" && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
  else if (a === "down" && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
  touch(p); renderPanel();
  if (a === "add") { const d = $$("#adbody details.it").pop(); if (d) d.open = true; }
}
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || !el.dataset.p) return;
  const t = el.dataset.t; let v = el.value;
  if (t === "num") v = Number(v) || 0; else if (t === "lines") v = v.split("\n").map(x => x.trim()).filter(Boolean); else if (t === "chk") v = el.checked;
  setp(S, el.dataset.p, v); touch(el.dataset.p);
});
document.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.t === "chk") { setp(S, e.target.dataset.p, e.target.checked); touch(e.target.dataset.p); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") hideAll(); });
function bindForms() {
$("#cf").addEventListener("submit", e => { e.preventDefault(); const v = $("#cfin").value; $("#cfin").value = ""; chatSubmit(v); });
$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const m = `Bonjour ${S.nom}, je suis ${$("#f-nom").value.trim() || "un visiteur"}. Besoin : ${$("#f-besoin").value}. ${$("#f-msg").value.trim()}`;
  window.open(waLink(m), "_blank", "noopener");
});
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); const err = $("#lg-err"); err.hidden = true;
  try { await sb.login($("#lg-mail").value, $("#lg-pass").value); role.admin = true; role.mode = "supabase"; hide("login"); renderMenu(); openEditor(); }
  catch (er) { err.textContent = er.message || "Connexion impossible"; err.hidden = false; }
});

}

/* ---------------------------------- démarrage ---------------------------------- */
async function loadRates() {
  if (!S.monnaies.auto) return;
  try {
    const r = await fetch("https://open.er-api.com/v6/latest/USD"); const j = await r.json();
    if (j && j.rates && j.rates.CDF) {
      liveRates = { USD: j.rates.CDF }; if (j.rates.EUR) liveRates.EUR = j.rates.CDF / j.rates.EUR;
      renderShop(); observe(true);
    }
  } catch (e) {}
}
async function detectRole() {
  try {
    const user = window.claude?.use ? await window.claude.use("user") : null;
    if (user && ((user.canEdit && user.canEdit()) || (user.isOwner && user.isOwner()))) { role.admin = true; role.mode = "artifact"; renderMenu(); }
  } catch (e) {}
}
async function boot() {
  const tpl = $("#tpl"); tpl.parentNode.insertBefore(tpl.content.cloneNode(true), tpl); bindForms();
  renderSite(false); timers();
  if (CONFIG.supabaseUrl && CONFIG.supabaseKey) {
    try { sb.token = sessionStorage.getItem("bs_tok"); } catch (e) {}
    try { const remote = await sb.load(); if (remote && Object.keys(remote).length) { savedBase = remote; S = deepMerge(clone(DEFAULTS), clone(remote)); renderSite(true); } } catch (e) {}
    if (sb.token) { role.admin = true; role.mode = "supabase"; renderMenu(); }
  } else detectRole();
  loadRates();
  route(); addEventListener("hashchange", route);
}
const ADMIN_MAIL = "bstrategiewebacademie@gmail.com";
function route() {
  if (location.hash !== "#modification") return;
  hideAll();
  if (role.admin && role.mode === "supabase") { openEditor(); return; }
  if (!CONFIG.supabaseUrl) return;
  $("#lg-mail").value = ADMIN_MAIL; show("login");
}
boot();
