<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>bStratégie web académie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style id="css">
:root{
  --bg:#f5f9fe; --surface:#ffffff; --fg:#0e1b2e; --muted:#566478; --line:#d9e4f1;
  --blue:#1473b9; --blue-deep:#0a3f73; --red:#e30f2d; --band:#0b2342; --band-fg:#f2f7fd;
  --band-muted:#a9bbd2; --chip:#eaf3fc; --shadow:0 18px 40px -22px rgba(10,63,115,.35);
  --font-display:'Outfit','Segoe UI',system-ui,sans-serif;
  --font-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08111f; --surface:#0f1c30; --fg:#eaf1fb; --muted:#9fb0c6; --line:#1f3150;
    --blue:#4aa3ff; --blue-deep:#7fbcff; --red:#ff5068; --band:#0a1a31; --band-fg:#f2f7fd;
    --band-muted:#a9bbd2; --chip:#14253f; --shadow:0 18px 40px -22px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08111f; --surface:#0f1c30; --fg:#eaf1fb; --muted:#9fb0c6; --line:#1f3150;
  --blue:#4aa3ff; --blue-deep:#7fbcff; --red:#ff5068; --band:#0a1a31; --band-fg:#f2f7fd;
  --band-muted:#a9bbd2; --chip:#14253f; --shadow:0 18px 40px -22px rgba(0,0,0,.8); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;font-size:14px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
img{max-width:100%;display:block}
button{font-family:inherit}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.grad{background:linear-gradient(90deg,var(--blue),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;cursor:pointer;font:600 .86rem var(--font-body);padding:.7rem 1.1rem;border-radius:999px;text-decoration:none;transition:transform .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn[disabled]{opacity:.6;cursor:default;transform:none}
.btn-primary{background:linear-gradient(90deg,var(--blue) 0%,#2b5fb0 55%,var(--red) 130%);color:#fff;box-shadow:0 12px 24px -14px var(--blue)}
.btn-ghost{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn-sm{padding:.5rem .85rem;font-size:.8rem}
.btn-red{background:var(--red);color:#fff}

.js .rv{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease;transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}

/* barre annonce */
.topbar{background:var(--band);color:var(--band-fg);font-size:.8rem}
.topbar .wrap{display:flex;gap:.6rem;align-items:center;justify-content:center;min-height:34px;padding-block:.3rem;text-align:center;flex-wrap:wrap}
.topbar .tag{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.14);padding:.12rem .45rem;border-radius:99px}
.topbar a{font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--red)}
.topbar .msg{transition:opacity .4s}

/* navigation */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:.8rem;min-height:56px}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font:700 .92rem var(--font-display);min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 0 1px var(--line);flex:none}
.navr{display:flex;align-items:center;gap:.5rem;flex:none}
.burger{width:40px;height:40px;border-radius:12px;border:0;cursor:pointer;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-content:center;gap:4px;padding:0}
.burger span{display:block;width:18px;height:2px;border-radius:2px;background:var(--fg);transition:transform .25s,opacity .25s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
@media(max-width:520px){.brand span{font-size:.84rem}.navr .hide-sm{display:none}}

/* tiroirs */
.scrim{position:fixed;inset:0;background:rgba(5,12,24,.5);z-index:84;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);background:var(--surface);z-index:90;transform:translateX(100%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none;visibility:visible;transition:transform .3s ease}
.drawer.admin{width:min(460px,100vw);z-index:92}
.dh{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;border-bottom:1px solid var(--line);font:700 .95rem var(--font-display)}
.x{width:34px;height:34px;border-radius:10px;border:0;background:var(--chip);color:var(--fg);cursor:pointer;font-size:1rem}
.menu-list{padding:.6rem;display:grid;gap:2px;overflow:auto}
.menu-list a,.menu-list button{display:flex;align-items:center;gap:.6rem;text-align:left;border:0;background:transparent;color:var(--fg);padding:.7rem .8rem;border-radius:12px;font:600 .92rem var(--font-body);cursor:pointer;text-decoration:none;width:100%}
.menu-list a:hover,.menu-list button:hover{background:var(--chip);color:var(--blue)}
.menu-list .sep{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:.9rem .8rem .3rem}
.menu-list .dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
.menu-list .dot.b{background:var(--blue)}

/* accueil */
.hero{position:relative;padding-block:clamp(2rem,5vw,3.6rem) clamp(2rem,4vw,3rem);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:2rem;align-items:center;position:relative}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}}
.hero h1{font-size:clamp(1.55rem,3.3vw,2.3rem);font-weight:800;margin-top:.7rem}
.rotwrap{display:block;height:1.15em;overflow:hidden;position:relative}
.rot{display:block;transition:transform .55s cubic-bezier(.7,0,.2,1),opacity .55s}
.hero p.lead{font-size:.95rem;color:var(--muted);max-width:30rem;margin-top:.9rem}
.cta-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.3rem}
.who{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1.2rem}
.who span{background:var(--chip);color:var(--blue-deep);font-weight:600;font-size:.75rem;padding:.28rem .7rem;border-radius:99px}
.stage{position:relative;aspect-ratio:1/1;max-width:400px;width:100%;margin-inline:auto}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55}
.blob.b1{width:60%;height:60%;left:-6%;top:6%;background:var(--blue);animation:drift 9s ease-in-out infinite}
.blob.b2{width:55%;height:55%;right:-4%;bottom:2%;background:var(--red);opacity:.4;animation:drift 11s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(18px,-16px) scale(1.08)}}
.ring{position:absolute;inset:9%;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--blue) 55%,transparent);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-card{position:absolute;inset:23%;border-radius:12%;background:#fff;box-shadow:var(--shadow),0 0 0 1px var(--line);overflow:hidden;animation:bob 6s ease-in-out infinite}
.logo-card img{width:100%;height:100%;object-fit:cover}
@keyframes bob{50%{transform:translateY(-10px)}}
.chip{position:absolute;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--line);border-radius:99px;padding:.4rem .75rem;font:600 .74rem var(--font-body);display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.chip.c2 i,.chip.c4 i{background:var(--red)}
.chip.c1{left:-2%;top:12%;animation:bob 5s ease-in-out infinite}
.chip.c2{right:-3%;top:26%;animation:bob 6.5s ease-in-out -2s infinite}
.chip.c3{left:2%;bottom:14%;animation:bob 7s ease-in-out -1s infinite}
.chip.c4{right:2%;bottom:6%;animation:bob 5.6s ease-in-out -3s infinite}

.ticker{background:var(--surface);border-block:1px solid var(--line);overflow:hidden;padding-block:.75rem}
.ticker .track{display:flex;gap:2rem;width:max-content;animation:scroll 32s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker span{font:600 .85rem var(--font-display);color:var(--muted);display:flex;align-items:center;gap:2rem;white-space:nowrap}
.ticker span::after{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(90deg,var(--blue),var(--red))}
@keyframes scroll{to{transform:translateX(-50%)}}

section{padding-block:clamp(2rem,5vw,3.8rem);scroll-margin-top:72px}
.head{max-width:36rem;margin-bottom:1.6rem}
.head h2{font-size:clamp(1.25rem,2.3vw,1.65rem);font-weight:800;margin-top:.4rem}
.head p{color:var(--muted);margin-top:.6rem;font-size:.9rem}

.services{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
@media(max-width:900px){.services{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.services{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.2rem;transition:transform .25s,box-shadow .25s,border-color .25s;min-width:0}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:var(--blue);margin-bottom:.9rem;transition:background .25s,color .25s}
.card:hover .ico{background:var(--blue);color:#fff}
.ico svg{width:22px;height:22px}
.card h3{font-size:.98rem;font-weight:700}
.card p{color:var(--muted);margin-top:.4rem;font-size:.84rem}
.card ul{list-style:none;padding:0;margin:.8rem 0 0;display:grid;gap:.35rem;font-size:.8rem}
.card li{display:flex;gap:.5rem;align-items:flex-start}
.card li::before{content:"";flex:none;width:7px;height:7px;margin-top:.5em;border-radius:50%;background:var(--red)}
.card.feat{grid-column:span 2;background:linear-gradient(135deg,var(--blue-deep),var(--blue) 70%,#3a5fb0);color:#fff;border:0;position:relative;overflow:hidden}
.card.feat::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(227,15,45,.55),transparent 70%)}
.card.feat p,.card.feat li{color:rgba(255,255,255,.9)}
.card.feat .ico{background:rgba(255,255,255,.18);color:#fff}
.card.feat .flag{display:inline-block;background:#fff;color:var(--red);font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.18rem .55rem;border-radius:99px;margin-bottom:.8rem}
.card.feat ul{grid-template-columns:1fr 1fr}
@media(max-width:600px){.card.feat{grid-column:auto}.card.feat ul{grid-template-columns:1fr}}

.band{background:var(--band);color:var(--band-fg);position:relative;overflow:hidden}
.band::before{content:"";position:absolute;left:-120px;bottom:-160px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(20,115,185,.55),transparent 70%)}
.band::after{content:"";position:absolute;right:-120px;top:-160px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(227,15,45,.4),transparent 70%)}
.band .wrap{position:relative;z-index:1}
.band .eyebrow{color:#7fbcff}
.band .head p{color:var(--band-muted)}
.aud{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
@media(max-width:860px){.aud{grid-template-columns:1fr}}
.aud .a{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);border-radius:18px;padding:1.2rem;transition:transform .25s,background .25s;min-width:0}
.aud .a:hover{transform:translateY(-4px);background:rgba(255,255,255,.1)}
.aud .num{font:800 clamp(1.7rem,3.4vw,2.3rem) var(--font-display);line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#7fbcff,#ff6a7d);-webkit-background-clip:text;background-clip:text;color:transparent}
.aud .lbl{font-weight:700;margin-top:.35rem;font-size:.9rem}
.aud p{color:var(--band-muted);font-size:.82rem;margin-top:.5rem}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin-top:1.2rem;border-top:1px solid rgba(255,255,255,.14);padding-top:1.2rem}
@media(max-width:700px){.mini{grid-template-columns:1fr 1fr}}
.mini b{display:block;font:700 1.25rem var(--font-display);font-variant-numeric:tabular-nums}
.mini span{color:var(--band-muted);font-size:.78rem}

.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem;align-items:center}
.tab{border:0;cursor:pointer;font:600 .8rem var(--font-body);padding:.45rem .95rem;border-radius:99px;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);transition:all .2s}
.tab[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:none}
.seg{margin-left:auto;display:flex;gap:2px;background:var(--surface);padding:3px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{border:0;background:transparent;color:var(--muted);font:700 .75rem var(--font-body);padding:.35rem .75rem;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.rate{font-size:.7rem;color:var(--muted);margin:-.6rem 0 1rem;text-align:right}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
@media(max-width:960px){.shop{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.shop{grid-template-columns:1fr}}
.prod{padding:0;overflow:hidden;display:flex;flex-direction:column}
.prod[hidden],.real[hidden]{display:none}
.cover{height:104px;position:relative;display:flex;align-items:flex-end;padding:.8rem;color:#fff;background:linear-gradient(135deg,var(--c1,#0a3f73),var(--c2,#1473b9));overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.cover .kind{position:relative;z-index:1;font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:.18rem .55rem;border-radius:99px}
.cover .tagn{position:absolute;right:.7rem;top:.7rem;z-index:1;background:#fff;color:var(--red);font-size:.62rem;font-weight:800;padding:.16rem .5rem;border-radius:99px;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.prod .body{padding:1.05rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.prod h3{font-size:.95rem}
.prod .meta{display:flex;gap:.8rem;flex-wrap:wrap;color:var(--muted);font-size:.76rem}
.prod .buy{margin-top:auto;padding-top:.7rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.price{font:800 1.05rem var(--font-display);font-variant-numeric:tabular-nums}
.price small{display:block;font:500 .68rem var(--font-body);color:var(--muted)}
.prod.ad{border-style:dashed;border-color:color-mix(in srgb,var(--red) 50%,var(--line));background:color-mix(in srgb,var(--red) 4%,var(--surface))}
.prod.ad .cover{background:repeating-linear-gradient(135deg,var(--chip) 0 14px,transparent 14px 28px);color:var(--muted)}
.prod.ad .cover .kind{background:var(--surface);color:var(--red)}
.paystrip{display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:1.2rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem;font-size:.82rem;color:var(--muted)}
.paystrip b{color:var(--fg)}

.real{padding:0;overflow:hidden;display:flex;flex-direction:column}
.shot{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,var(--c1,#0a3f73),var(--c2,#1473b9));display:grid;place-items:center;color:rgba(255,255,255,.9);border:0;padding:0;width:100%;font:inherit}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.real:hover .shot img{transform:scale(1.06)}
button.shot{cursor:zoom-in}
.shot .phd{text-align:center;display:grid;gap:.3rem;justify-items:center;font-size:.74rem;font-weight:600;padding:1rem}
.shot .phd svg{width:30px;height:30px;opacity:.85}
.shot .cat{position:absolute;left:.7rem;top:.7rem;z-index:1;background:rgba(255,255,255,.92);color:var(--blue-deep);font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.16rem .55rem;border-radius:99px}
.real .body{padding:1rem 1.1rem 1.2rem}
.real h3{font-size:.95rem}

.adwide{padding-block:0 clamp(2rem,5vw,3.4rem)}
.adbox{position:relative;border-radius:22px;overflow:hidden;border:1px dashed color-mix(in srgb,var(--blue) 40%,var(--line));background:var(--surface)}
.slide{display:none;align-items:center;gap:1.2rem;padding:1.2rem 1.5rem;min-height:120px;animation:fade .6s}
.slide.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.slide .ph{flex:none;width:140px;height:84px;border-radius:14px;background:linear-gradient(135deg,var(--accent,var(--blue)),var(--accent2,var(--red)));display:grid;place-items:center;color:#fff;font:800 .9rem var(--font-display);overflow:hidden;text-align:center;padding:.5rem}
.slide .ph img{width:100%;height:100%;object-fit:cover}
.slide .tx{flex:1;min-width:0}
.slide h3{font-size:1rem}
.slide p{color:var(--muted);margin-top:.25rem;font-size:.84rem}
.sp{position:absolute;right:14px;top:8px;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
@media(max-width:700px){.slide{flex-direction:column;align-items:flex-start}.slide .ph{width:100%}}

.tm{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--blue) 7%,transparent))}
.tmbox{position:relative;max-width:720px;margin-inline:auto}
.quote{display:none;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(1.2rem,3vw,2rem);box-shadow:var(--shadow);animation:fade .6s;margin:0}
.quote.on{display:block}
.quote .qm{font:800 3rem/0.6 var(--font-display);color:var(--red)}
.quote blockquote{margin:.3rem 0 1rem;font:500 clamp(.95rem,1.6vw,1.1rem)/1.5 var(--font-display)}
.who2{display:flex;align-items:center;gap:.7rem}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 .92rem var(--font-display);background:linear-gradient(135deg,var(--blue),var(--red));overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.who2 b{display:block;font-size:.88rem}
.who2 span{color:var(--muted);font-size:.8rem}
.stars{margin-left:auto;color:#f0a400;letter-spacing:2px;font-size:.85rem}
.tmnav{display:flex;align-items:center;justify-content:center;gap:.9rem;margin-top:1.2rem}
.arrow{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line);font-size:1rem;transition:all .2s}
.arrow:hover{background:var(--blue);color:#fff;box-shadow:none}
.dots{display:flex;gap:.4rem}
.dots button{width:8px;height:8px;border-radius:99px;border:0;padding:0;cursor:pointer;background:var(--line);transition:all .25s}
.dots button[aria-current="true"]{width:24px;background:linear-gradient(90deg,var(--blue),var(--red))}

.contact{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;align-items:start}
@media(max-width:860px){.contact{grid-template-columns:1fr}}
.contact h2{font-size:clamp(1.25rem,2.3vw,1.65rem);font-weight:800;margin-top:.4rem}
.pts{display:grid;gap:.7rem;margin-top:1.3rem;padding:0;list-style:none}
.pts li{display:flex;gap:.7rem;align-items:center}
.pts .ico{margin:0;width:36px;height:36px;border-radius:11px;flex:none}
.pts b{display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pts span{user-select:all;word-break:break-word;font-size:.88rem}
.form{display:grid;gap:.75rem;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:1.3rem;box-shadow:var(--shadow);min-width:0}
.form label,.fld label{font-weight:600;font-size:.8rem;display:grid;gap:.3rem}
.form input,.form select,.form textarea,.in-s{font:400 .9rem var(--font-body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:.6rem .8rem;width:100%;transition:border-color .2s}
.form input:focus,.form select:focus,.form textarea:focus,.in-s:focus{outline:0;border-color:var(--blue)}
.form textarea{min-height:84px;resize:vertical}
.form small{color:var(--muted);font-size:.75rem}

footer{border-top:1px solid var(--line);padding-block:1.6rem 5.5rem}
footer .wrap{display:flex;gap:1rem 2rem;justify-content:space-between;flex-wrap:wrap;align-items:center}
.soc{display:flex;gap:.5rem}
.soc a{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);transition:all .2s}
.soc a:hover{background:var(--blue);color:#fff;box-shadow:none;transform:translateY(-2px)}
.soc svg{width:18px;height:18px}
footer small{color:var(--muted);font-size:.76rem}

/* boutons flottants */
.fab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:center;gap:.5rem;color:#fff;font:700 .8rem var(--font-body);text-decoration:none;padding:.7rem 1rem;border-radius:99px;border:0;cursor:pointer;transition:transform .2s}
.fab:hover{transform:translateY(-3px)}
.fab svg{width:19px;height:19px}
.fab.wa{right:calc(14px + env(safe-area-inset-right,0px));background:#1faa59;box-shadow:0 12px 26px -10px rgba(31,170,89,.7)}
.fab.gf{left:calc(14px + env(safe-area-inset-left,0px));background:linear-gradient(90deg,var(--blue),var(--red));box-shadow:0 12px 26px -10px var(--blue)}
@media(max-width:480px){.fab.wa span{display:none}.fab.wa{padding:.8rem}}

/* fenêtres */
.modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:14px;background:rgba(5,12,24,.62)}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:20px;width:min(500px,100%);max-height:min(88vh,720px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:fade .3s}
.sheet.wide{width:min(720px,100%)}
.sb{padding:1rem;overflow:auto;display:grid;gap:.8rem;align-content:start}
.chat{display:flex;flex-direction:column;gap:.5rem;padding:1rem;overflow:auto;flex:1;min-height:220px}
.msg{max-width:84%;padding:.55rem .8rem;border-radius:14px;font-size:.86rem;line-height:1.45;animation:fade .3s;word-break:break-word}
.msg.bot{background:var(--chip);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:linear-gradient(90deg,var(--blue),#2b5fb0);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg a{color:var(--blue);font-weight:700}
.typing{display:flex;gap:4px;padding:.7rem .9rem}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bob 1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.qr{display:flex;gap:.4rem;flex-wrap:wrap;padding:0 1rem .8rem}
.qr button{border:0;cursor:pointer;font:600 .82rem var(--font-body);padding:.5rem .9rem;border-radius:99px;background:var(--surface);color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.qr button:hover{background:var(--blue);color:#fff}
.cf{display:flex;gap:.5rem;padding:.7rem 1rem;border-top:1px solid var(--line)}
.cf input{flex:1;min-width:0}
.gl{display:grid;gap:.5rem}
.gl button{display:flex;gap:.7rem;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:.7rem .8rem;border-radius:14px;cursor:pointer;font:inherit;transition:border-color .2s,transform .2s}
.gl button:hover{border-color:var(--blue);transform:translateY(-2px)}
.gl .k{flex:none;font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--red);color:#fff;padding:.2rem .5rem;border-radius:99px}
.gl b{display:block;font-size:.88rem}
.gl span{font-size:.78rem;color:var(--muted)}
.paynum{display:flex;align-items:center;gap:.6rem;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:.6rem .8rem}
.paynum div{flex:1;min-width:0}
.paynum b{display:block;font-size:.82rem}
.paynum code{font:700 1rem var(--font-display);letter-spacing:.02em;user-select:all}
.paynum small{display:block;color:var(--muted);font-size:.72rem}
.amount{background:linear-gradient(135deg,var(--blue-deep),var(--blue));color:#fff;border-radius:16px;padding:.9rem 1rem}
.amount b{font:800 1.4rem var(--font-display);display:block}
.amount span{font-size:.78rem;opacity:.9}
.steps{display:grid;gap:.3rem;font-size:.84rem;color:var(--muted);margin:0;padding-left:1.1rem}

/* éditeur */
.ad-tabs{display:flex;gap:.3rem;overflow:auto;padding:.5rem .7rem;border-bottom:1px solid var(--line)}
.ad-tabs button{flex:none;border:0;background:var(--chip);color:var(--fg);font:600 .74rem var(--font-body);padding:.4rem .75rem;border-radius:99px;cursor:pointer}
.ad-tabs button[aria-pressed="true"]{background:var(--blue);color:#fff}
.ad-body{padding:.9rem;overflow:auto;flex:1}
.ad-body h4{margin:1rem 0 .5rem;font:700 .82rem var(--font-display);color:var(--blue)}
.ad-body h4:first-child{margin-top:0}
.fld{display:grid;gap:.25rem;margin-bottom:.7rem}
.fld label{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:none}
.fld input,.fld textarea,.fld select{font:400 .82rem var(--font-body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:.5rem .65rem;width:100%}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:0;border-color:var(--blue)}
.fld textarea{min-height:60px;resize:vertical}
.fld.chk{display:flex;align-items:center;gap:.5rem}
.fld.chk input{width:auto}
details.it{border:1px solid var(--line);border-radius:12px;margin-bottom:.5rem;background:var(--surface)}
details.it summary{padding:.55rem .75rem;cursor:pointer;font:600 .8rem var(--font-body);list-style:none;display:flex;gap:.5rem;justify-content:space-between;align-items:center}
details.it summary::-webkit-details-marker{display:none}
details.it .in{padding:.2rem .75rem .6rem}
.row{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
.mini-btn{border:0;cursor:pointer;background:var(--chip);color:var(--fg);font:600 .72rem var(--font-body);padding:.35rem .65rem;border-radius:99px}
.mini-btn.del{color:var(--red)}
.mini-btn.add{background:var(--blue);color:#fff}
.imgprev{display:flex;gap:.5rem;align-items:center}
.imgprev img{width:54px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
.ad-foot{padding:.7rem .9rem;border-top:1px solid var(--line);display:flex;gap:.6rem;align-items:center;justify-content:space-between}
.ad-foot small{color:var(--muted);font-size:.72rem}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:93;background:var(--band);color:#fff;border-radius:99px;padding:.5rem .6rem .5rem 1rem;display:flex;gap:.8rem;align-items:center;box-shadow:0 18px 40px -12px rgba(0,0,0,.6);font-size:.8rem;white-space:nowrap}
.savebar[hidden]{display:none}
pre.code{margin:0;background:#0b1626;color:#d7e6fb;border-radius:12px;padding:.8rem;font:500 .74rem/1.5 ui-monospace,Menlo,Consolas,monospace;overflow:auto;white-space:pre}
.gtabs{display:flex;gap:.3rem;flex-wrap:wrap}
.gtabs button{border:0;background:var(--chip);color:var(--fg);font:600 .78rem var(--font-body);padding:.45rem .85rem;border-radius:99px;cursor:pointer}
.gtabs button[aria-pressed="true"]{background:var(--blue);color:#fff}
.gbox h3{font-size:1rem}
.gbox p,.gbox li{font-size:.84rem;color:var(--muted)}
.gbox ol{padding-left:1.1rem;display:grid;gap:.4rem;margin:.6rem 0}
.gbox li b{color:var(--fg)}
.note{background:color-mix(in srgb,var(--red) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--red) 30%,var(--line));border-radius:12px;padding:.6rem .8rem;font-size:.8rem}


/* =================== REFONTE DESIGN & ANIMATIONS =================== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--navh:68px}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes gshift{to{background-position:200% 0}}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
@keyframes fillbar{to{transform:scaleX(1)}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes orb{50%{transform:translate(40px,-30px) scale(1.12)}}
@keyframes slidein{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}

/* barre de progression */
.progress{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--blue),var(--red));z-index:120;pointer-events:none}

/* texte en dégradé animé */
.grad{background:linear-gradient(90deg,var(--blue),var(--red),var(--blue));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gshift 7s linear infinite}

/* ---- navigation : logo à gauche, nom + trois traits à droite ---- */
.nav{background:transparent;backdrop-filter:none;border-bottom:0;height:var(--navh);transition:background .35s,box-shadow .35s}
.nav .wrap{height:100%;min-height:0;max-width:1240px}
.nav.solid{background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 1px 0 var(--line),0 14px 34px -24px rgba(10,35,66,.5)}
.brand img{width:46px;height:46px;border-radius:14px;box-shadow:0 8px 22px -8px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.25);background:#fff;transition:transform .5s var(--ease)}
.brand:hover img{transform:rotate(-6deg) scale(1.06)}
.navr{gap:.9rem}
.brandname{font:700 .98rem var(--font-display);letter-spacing:.01em;text-decoration:none;color:var(--fg);white-space:nowrap;position:relative;transition:color .3s}
.brandname::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--red));transform:scaleX(0);transform-origin:0 50%;transition:transform .4s var(--ease)}
.brandname:hover::after{transform:scaleX(1)}
.nav:not(.solid) .brandname{color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.45)}
.burger{width:48px;height:48px;border-radius:50%;justify-items:end;gap:5px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);transition:background .3s,box-shadow .3s,transform .3s var(--ease)}
.burger span{height:2px;width:22px;transition:transform .35s var(--ease),opacity .25s,width .3s var(--ease),background .3s}
.burger span:nth-child(2){width:14px}
.burger:hover span:nth-child(2){width:22px}
.burger:hover{transform:scale(1.06)}
.nav:not(.solid) .burger{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.nav:not(.solid) .burger span{background:#fff}
.burger[aria-expanded="true"] span{width:22px}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:520px){.brandname{font-size:.86rem}.nav .wrap{padding-inline:14px}}

/* ---- tiroir du menu ---- */
.drawer{background:linear-gradient(180deg,var(--surface) 0%,color-mix(in srgb,var(--surface) 92%,var(--blue)) 100%);border-left:1px solid var(--line);transition:transform .55s var(--ease),visibility 0s .55s}
.drawer.open{transition:transform .55s var(--ease)}
.drawer:not(.admin) .dh{position:relative;padding:1.1rem 1.2rem;border-bottom:0}
.drawer:not(.admin) .dh::after{content:"";position:absolute;left:1.2rem;right:1.2rem;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--red))}
.scrim{backdrop-filter:blur(3px)}
.menu-list a,.menu-list button{transition:background .25s,color .25s,padding-left .3s var(--ease)}
.menu-list a:hover,.menu-list button:hover{padding-left:1.15rem}
.drawer.open .menu-list>*{animation:slidein .55s var(--ease) both}
.drawer.open .menu-list>*:nth-child(1){animation-delay:165ms}
.drawer.open .menu-list>*:nth-child(2){animation-delay:210ms}
.drawer.open .menu-list>*:nth-child(3){animation-delay:255ms}
.drawer.open .menu-list>*:nth-child(4){animation-delay:300ms}
.drawer.open .menu-list>*:nth-child(5){animation-delay:345ms}
.drawer.open .menu-list>*:nth-child(6){animation-delay:390ms}
.drawer.open .menu-list>*:nth-child(7){animation-delay:435ms}
.drawer.open .menu-list>*:nth-child(8){animation-delay:480ms}
.drawer.open .menu-list>*:nth-child(9){animation-delay:525ms}
.drawer.open .menu-list>*:nth-child(10){animation-delay:570ms}
.drawer.open .menu-list>*:nth-child(11){animation-delay:615ms}
.drawer.open .menu-list>*:nth-child(12){animation-delay:660ms}
.drawer.open .menu-list>*:nth-child(13){animation-delay:705ms}
.drawer.open .menu-list>*:nth-child(14){animation-delay:750ms}
.drawer.open .menu-list>*:nth-child(15){animation-delay:795ms}
.drawer.open .menu-list>*:nth-child(16){animation-delay:840ms}
.drawer.open .menu-list>*:nth-child(17){animation-delay:885ms}
.drawer.open .menu-list>*:nth-child(18){animation-delay:930ms}

/* ---- haut de page : images défilantes en fond ---- */
.hero{margin-top:calc(var(--navh) * -1);min-height:min(100svh,940px);display:flex;align-items:center;padding-block:calc(var(--navh) + 2.5rem) 5.5rem;color:#fff;isolation:isolate;background:#06101f}
.hero>.wrap{width:100%}
.hero-bg{position:absolute;left:0;right:0;top:-18%;bottom:0;z-index:-2;overflow:hidden;will-change:transform}
.hs{position:absolute;inset:-3%;background-size:cover;background-position:center;opacity:0;transform:scale(1.08);transition:opacity 1.5s ease,transform 9s linear}
.hs.on{opacity:1;transform:scale(1.2) translate(-2%,-1%)}
.hs:nth-child(even).on{transform:scale(1.2) translate(2%,1%)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(6,16,31,.84) 0%,rgba(6,16,31,.52) 48%,rgba(6,16,31,.1) 100%),linear-gradient(0deg,#06101f 0%,transparent 30%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(600px 400px at calc(80% + var(--px,0) * 40px) calc(30% + var(--py,0) * 40px),rgba(43,143,224,.22),transparent 70%),radial-gradient(500px 400px at 10% 100%,rgba(227,15,45,.2),transparent 70%)}
.hero .wrap>div:first-child>*{animation:rise .95s var(--ease) both}
.hero .wrap>div:first-child>:nth-child(1){animation-delay:.15s}
.hero .wrap>div:first-child>:nth-child(2){animation-delay:.3s}
.hero .wrap>div:first-child>:nth-child(3){animation-delay:.45s}
.hero .wrap>div:first-child>:nth-child(4){animation-delay:.6s}
.hero .wrap>div:first-child>:nth-child(5){animation-delay:.75s}
.hero .stage{animation:rise 1.2s .5s var(--ease) both}
.hero h1{font-size:clamp(2rem,5.4vw,3.8rem);line-height:1.08;color:#fff;text-shadow:0 4px 40px rgba(0,0,0,.4)}
.hero .rotwrap{height:1.2em}
.hero .grad{background:linear-gradient(90deg,#7fbcff,#ff6a7d,#7fbcff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .eyebrow{color:#a9d4ff;display:inline-flex;align-items:center;gap:.7rem;font-size:.74rem}
.hero .eyebrow::before{content:"";width:34px;height:2px;border-radius:2px;background:linear-gradient(90deg,#7fbcff,#ff6a7d)}
.hero p.lead{color:#d5e1f1;font-size:1.05rem;max-width:34rem}
.hero .who span{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px)}
.hero .btn-ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45);backdrop-filter:blur(8px)}
.hero .btn-ghost:hover{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1.5px #fff}
.hero .btn{padding:.85rem 1.4rem;font-size:.92rem}
.hero .stage{max-width:430px}
.hero .blob{opacity:.5}
.hero .ring{border-color:rgba(255,255,255,.35)}
.hero .logo-card{box-shadow:0 30px 70px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.3)}
.hero .chip{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(10px);box-shadow:0 14px 34px -14px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.25)}
.hero .stage .chip,.hero .stage .logo-card{translate:calc(var(--px,0) * 14px) calc(var(--py,0) * 12px)}
.hero-ui{position:absolute;left:50%;bottom:1.6rem;transform:translateX(-50%);width:min(1120px,100%);padding-inline:16px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.hdots{display:flex;gap:.5rem}
.hd{width:46px;height:4px;border-radius:4px;border:0;padding:0;background:rgba(255,255,255,.28);position:relative;overflow:hidden;cursor:pointer}
.hd i{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:0 50%}
.hd.on i{animation:fillbar var(--hdur,6.5s) linear forwards}
.scroll-cue{width:26px;height:42px;border:2px solid rgba(255,255,255,.65);border-radius:14px;position:relative;display:block}
.scroll-cue i{position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fff;animation:wheel 1.7s ease-in-out infinite}
@media(max-width:900px){.hero{padding-block:calc(var(--navh) + 1.8rem) 5rem;align-items:flex-start}.hero::before{background:linear-gradient(180deg,rgba(6,16,31,.82),rgba(6,16,31,.55) 60%,#06101f)}.hero .stage{max-width:300px;margin-top:.8rem}.scroll-cue{display:none}}

/* ---- bandeau défilant ---- */
.ticker{background:linear-gradient(90deg,#0a3f73,#0b2342 50%,#7d0f20);border:0;padding-block:1rem;position:relative}
.ticker span{color:#fff;font-size:1rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;opacity:.92}
.ticker span::after{background:#fff;opacity:.7;width:8px;height:8px}
.ticker .track{animation-duration:36s}

/* ---- apparition au défilement ---- */
.js .rv{opacity:0;transform:translateY(38px) scale(.985);filter:blur(5px);transition:opacity .8s var(--ease),transform .8s var(--ease),filter .8s var(--ease);transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none;filter:none}

/* ---- titres de section ---- */
.head .eyebrow{display:inline-flex;align-items:center;gap:.65rem}
.head .eyebrow::before{content:"";width:30px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--red))}
.head h2{font-size:clamp(1.45rem,3vw,2.1rem)}
.band .head .eyebrow::before{background:linear-gradient(90deg,#7fbcff,#ff6a7d)}

/* ---- cartes : projecteur qui suit le curseur ---- */
.card,.aud .a{position:relative}
.card::before,.aud .a::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--blue) 17%,transparent),transparent 62%)}
.card:hover::before,.aud .a:hover::before{opacity:1}
.card.feat::before{background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.18),transparent 62%)}
.services .card{overflow:hidden}
.services .card::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--red));transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease)}
.services .card.feat::after{inset:auto;left:auto;right:-60px;top:-60px;width:200px;height:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(227,15,45,.55),transparent 70%);transform:none}
.services .card:not(.feat):hover::after{transform:scaleX(1)}
.card:hover{transform:translateY(-6px)}
.ico{transition:background .3s,color .3s,transform .5s var(--ease)}

/* ---------------------------------- animations ---------------------------------- */
let io = null;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el) {
  $$("[data-n]", el).concat(el.matches && el.matches("[data-n]") ? [el] : []).forEach(n => {
    const end = +n.dataset.n, t0 = performance.now();
    const tick = t => { const p = Math.min(1, (t - t0) / 1400); n.textContent = "+" + Math.round(end * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
function observe(instant) {
  if (!("IntersectionObserver" in window) || calm) { $$(".rv").forEach(e => e.classList.remove("rv")); return; }
  document.documentElement.classList.add("js");
  if (!io) io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const tg = e.target; tg.classList.add("in"); io.unobserve(tg); countUp(tg);
    setTimeout(() => tg.classList.remove("rv", "in"), 1100);
  }), { threshold: .12 });
  $$(".rv:not([data-o])").forEach(el => {
    el.dataset.o = 1;
    if (instant) el.classList.remove("rv"); else io.observe(el);
  });
}
function timers() {
  setInterval(() => {
    const w = S.accueil.mots, el = $("#rot"); if (w.length < 2) return;
    el.dataset.i = ((+el.dataset.i || 0) + 1) % w.length;
    el.style.transform = "translateY(-110%)"; el.style.opacity = 0;
    setTimeout(() => {
      el.textContent = w[+el.dataset.i % w.length] || "";
      el.style.transition = "none"; el.style.transform = "translateY(110%)";
      void el.offsetWidth; el.style.transition = ""; el.style.transform = "none"; el.style.opacity = 1;
    }, 560);
  }, 2600);
  setInterval(() => {
    const B = S.pub.barre, bar = $("#topbar"); if (bar.hidden || B.messages.length < 2) return;
    const i = (+bar.dataset.i + 1) % B.messages.length, m = B.messages[i], msg = $("#topmsg"); msg.style.opacity = 0;
    setTimeout(() => { msg.innerHTML = `${esc(m.texte)} <a href="${esc(href(m.url))}"${ext(m.url)}>${esc(m.lien)}</a>`; bar.dataset.i = i; msg.style.opacity = 1; }, 350);
  }, 5000);
  setInterval(() => {
    const sl = $$("#adbox .slide"); if (sl.length < 2) return;
    const k = Math.max(0, sl.findIndex(s => s.classList.contains("on"))); sl[k].classList.remove("on"); sl[(k + 1) % sl.length].classList.add("on");
  }, 6000);
  setInterval(() => { if (S.avis.liste.length > 1 && !document.hidden) goTm(ui.tm + 1); }, 7000);
}
function goTm(n) {
  const n2 = S.avis.liste.length; if (!n2) return; ui.tm = (n + n2) % n2;
  $$(".quote").forEach((q, i) => q.classList.toggle("on", i === ui.tm));
  $$("#dots button").forEach((b, i) => b.setAttribute("aria-current", i === ui.tm));
}

function show(id) {
  if (id === "menu" || id === "admin") {
    $("#" + id).classList.add("open");
    if (id === "menu") { $("#scrim").classList.add("on"); $("#burger").setAttribute("aria-expanded", "true"); }
    return;
  }
  const m = $("#" + id + "Modal") || $("#" + id); if (m) m.hidden = false;
}
function hide(id) {
  if (id === "menu" || id === "admin") {
    $("#" + id).classList.remove("open");
    if (id === "menu") { $("#scrim").classList.remove("on"); $("#burger").setAttribute("aria-expanded", "false"); }
    return;
  }
  const m = $("#" + id + "Modal") || $("#" + id); if (m) m.hidden = true;
}

const chat = { item: null, prenom: "", email: "", step: "", ch: [] };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
function addMsg(who, html) { const d = document.createElement("div"); d.className = "msg " + who; d.innerHTML = html; $("#chat").append(d); $("#chat").scrollTop = 1e6; return d; }
async function say(html, delay = 650) {
  const t = document.createElement("div"); t.className = "msg bot typing"; t.innerHTML = "<i></i><i></i><i></i>"; $("#chat").append(t); $("#chat").scrollTop = 1e6;
  await sleep(delay); t.remove(); addMsg("bot", html);
}
function ask(type, ph) { $("#qr").hidden = true; $("#cf").hidden = false; const i = $("#cfin"); i.type = type; i.placeholder = ph; i.value = ""; setTimeout(() => i.focus(), 60); }
function choices(list) {
  $("#cf").hidden = true; chat.ch = list; const q = $("#qr"); q.hidden = false;
  q.innerHTML = list.map((c, i) => `<button type="button" data-ch="${i}">${esc(c[0])}</button>`).join("");
}
function openFree() {
  const G = S.gratuits; $("#freeTitle").textContent = G.titre;
  $("#chat").hidden = true; $("#qr").hidden = true; $("#cf").hidden = true;
  const l = $("#freeList"); l.hidden = false;
  l.innerHTML = `<p style="font-size:.86rem;color:var(--muted)">${esc(G.texte)}</p><div class="gl">` +
    (G.liste.length ? G.liste.map((g, i) => `<button type="button" data-gf="${i}"><span class="k">${esc(g.type)}</span><div><b>${esc(g.titre)}</b><span>${esc(g.texte)}</span></div></button>`).join("")
      : "<p>Les guides arrivent bientôt.</p>") + "</div>";

}
async function startChat(i) {
  const it = S.gratuits.liste[i]; if (!it) return;
  Object.assign(chat, { item: it, prenom: "", email: "", step: "prenom" });
  $("#freeList").hidden = true; const c = $("#chat"); c.hidden = false; c.innerHTML = "";
  await say(`Bonjour ! Tu as choisi : <b>${esc(it.titre)}</b>. Quel est ton prénom ?`, 450);
  ask("text", "Ton prénom");
}
async function sendLead() {
  const w = S.gratuits.webhook; if (!w) return false;
  try {
    await fetch(w, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ prenom: chat.prenom, email: chat.email, titre: chat.item.titre, type: chat.item.type, date: new Date().toISOString() }) });
    return true;
  } catch (e) { return false; }
}
async function chatSubmit(v) {
  v = v.trim(); if (!v) return;
  if (chat.step === "prenom") {
    chat.prenom = cap(v); addMsg("me", esc(v)); $("#cf").hidden = true; chat.step = "confirm";
    const t = chat.item.type.toLowerCase();
    await say(`Bonjour ${esc(chat.prenom)}, tu veux recevoir ton ${t} gratuit « ${esc(chat.item.titre)} » ?`);
    choices([["Oui, je le veux", async () => {
      addMsg("me", "Oui, je le veux"); chat.step = "email";
      await say("Super ! Quelle est ton adresse e-mail ?", 500); ask("email", "ton@email.com");
    }], ["Non merci", async () => {
      addMsg("me", "Non merci"); await say("Pas de souci. Tu peux choisir un autre guide quand tu veux.", 500);
      choices([["Voir les autres guides", () => openFree()]]);
    }]]);
  } else if (chat.step === "email") {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { await say("Cette adresse ne semble pas correcte. Peux-tu la réécrire ?", 400); ask("email", "ton@email.com"); return; }
    chat.email = v; chat.step = "envoi"; addMsg("me", esc(v)); $("#cf").hidden = true;
    await say("ok", 350);
    const sent = await sendLead(), t = chat.item.type.toLowerCase();
    await say(sent ? `Ton ${t} t'a été envoyé à <b>${esc(v)}</b>. Pense à vérifier tes courriers indésirables.` : `Voici ton ${t}, ${esc(chat.prenom)}.`, 900);
    if (chat.item.lien) await say(`Tu peux aussi le lire ici : <a href="${esc(chat.item.lien)}" target="_blank" rel="noopener">Ouvrir « ${esc(chat.item.titre)} »</a>`, 500);
    await say("Tu veux passer à l'étape supérieure ?", 700);
    choices([["Oui", async () => {
      addMsg("me", "Oui"); await say("Parfait ! Je t'emmène vers nos formations complètes.", 500); await sleep(700); hide("free");
      $("#formations").scrollIntoView({ behavior: "smooth" });
    }], ["Plus tard", async () => {
      addMsg("me", "Plus tard"); await say(`Pas de souci, ${esc(chat.prenom)}. À bientôt !`, 500);
      choices([["Voir les autres guides", () => openFree()]]);
    }]]);
  }
}

function fieldHTML(full, f) {
  const v = get(S, full), id = "f_" + full.replace(/\./g, "_"), d = `data-p="${esc(full)}" data-t="${f.t}"`;
  if (f.t === "chk") return `<div class="fld chk"><input type="checkbox" id="${id}" ${d} ${v ? "checked" : ""}><label for="${id}">${esc(f.l)}</label></div>`;
  let inp;
  if (f.t === "area") inp = `<textarea id="${id}" ${d}>${esc(v)}</textarea>`;
  else if (f.t === "lines") inp = `<textarea id="${id}" ${d}>${esc((v || []).join("\n"))}</textarea>`;
  else if (f.t === "num") inp = `<input id="${id}" type="number" inputmode="numeric" ${d} value="${esc(v)}">`;
  else if (f.t === "sel") inp = `<select id="${id}" ${d}>${f.opts().map(o => `<option${o === v ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (f.t === "img") inp = `<div class="imgprev">${v ? `<img src="${esc(v)}" alt="">` : ""}<input id="${id}" type="text" ${d} value="${esc(v)}" placeholder="Adresse de l'image"></div><div class="row"><button class="mini-btn add" type="button" data-act="upload" data-p="${esc(full)}">Choisir une image</button><button class="mini-btn" type="button" data-act="clearimg" data-p="${esc(full)}">Retirer</button></div>`;
  else inp = `<input id="${id}" type="${f.t === "url" ? "url" : "text"}" ${d} value="${esc(v)}">`;
  return `<div class="fld"><label for="${id}">${esc(f.l)}</label>${inp}</div>`;
}
function blockHTML(b) {
  let h = `<h4>${esc(b.title)}</h4>`;
  if (!b.list) return h + b.fields.map(f => fieldHTML((b.path ? b.path + "." : "") + f.k, f)).join("");
  const arr = get(S, b.path) || [];
  arr.forEach((it, i) => {
    const sum = it.titre || it.nom || it.sponsor || it.texte || it[b.fields[0].k] || ("Élément " + (i + 1));
    h += `<details class="it"><summary><span>${esc(String(sum).slice(0, 48))}</span></summary><div class="in">${b.fields.map(f => fieldHTML(b.path + "." + i + "." + f.k, f)).join("")}
      <div class="row"><button class="mini-btn" type="button" data-act="up" data-p="${esc(b.path)}" data-i="${i}">↑ Monter</button><button class="mini-btn" type="button" data-act="down" data-p="${esc(b.path)}" data-i="${i}">↓ Descendre</button><button class="mini-btn del" type="button" data-act="del" data-p="${esc(b.path)}" data-i="${i}">Supprimer</button></div></div></details>`;
  });
  return h + `<div class="row"><button class="mini-btn add" type="button" data-act="add" data-p="${esc(b.path)}">+ Ajouter</button></div>`;
}

async function shrink(file, max = 1400) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", .85));
}
async function uploadImage(file) {
  const blob = await shrink(file);
  if (role.mode === "supabase") return sb.upload(blob, Date.now() + "-" + Math.random().toString(36).slice(2, 7) + ".jpg");
  const assets = window.claude?.use ? await window.claude.use("assets") : null;
  if (!assets) throw new Error("Le téléversement d'images n'est pas disponible ici.");
  const r = await assets.upload(blob); return r.url;
}

const HERO_MS = 6500;
let heroI = 0, heroT = null;
function buildHeroSlides(A) {
  const bg = $("#herobg"), sl = (A.fond || []).filter(f => f && f.image), key = sl.map(f => f.image).join("|");
  if (bg.dataset.k === key) return;
  bg.dataset.k = key; bg.textContent = "";
  sl.forEach(f => { const d = document.createElement("div"); d.className = "hs"; d.style.backgroundImage = 'url("' + String(f.image).replace(/"/g, "%22") + '")'; bg.appendChild(d); });
  $("#hdots").innerHTML = sl.length > 1 ? sl.map((f, i) => `<button class="hd" type="button" aria-label="Image ${i + 1}" data-hi="${i}"><i></i></button>`).join("") : "";
  clearTimeout(heroT); heroI = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => heroGo(0)));
}
function heroGo(n) {
  const s = $$("#herobg .hs"), d = $$("#hdots .hd"); clearTimeout(heroT); if (!s.length) return;
  heroI = (n + s.length) % s.length;
  s.forEach((e, i) => e.classList.toggle("on", i === heroI));
  d.forEach((e, i) => { e.classList.remove("on"); if (i === heroI) { void e.offsetWidth; e.classList.add("on"); } });
  if (s.length > 1 && !calm) heroT = setTimeout(() => heroGo(heroI + 1), HERO_MS);
}
function initFx() {
  const nav = $(".nav"), bar = $("#progress"), hero = $(".hero"), bg = $("#herobg");
  let tick = false;
  const onScroll = () => {
    if (tick) return; tick = true;
    requestAnimationFrame(() => {
      tick = false;
      const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
      nav.classList.toggle("solid", y > 40);
      bar.style.transform = `scaleX(${h > 0 ? Math.min(1, y / h) : 0})`;
      if (!calm) bg.style.transform = `translate3d(0,${Math.min(150, y * .22)}px,0)`;
    });
  };
  addEventListener("scroll", onScroll, { passive: true }); onScroll();
  $("#hdots").addEventListener("click", e => { const b = e.target.closest("[data-hi]"); if (b) heroGo(+b.dataset.hi); });
  if (calm) return;
  hero.addEventListener("pointermove", e => {
    const r = hero.getBoundingClientRect();
    hero.style.setProperty("--px", ((e.clientX - r.left) / r.width - .5) * 2);
    hero.style.setProperty("--py", ((e.clientY - r.top) / r.height - .5) * 2);
  }, { passive: true });
  document.addEventListener("pointermove", e => {
    const c = e.target.closest && e.target.closest(".card,.aud .a"); if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px"); c.style.setProperty("--my", (e.clientY - r.top) + "px");
  }, { passive: true });
}
